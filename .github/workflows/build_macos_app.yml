# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build macOS App v2.0

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure secrets and environment
        run: |
          echo "🔧 Configurando secrets y variables de entorno..."
          
          # Crear directorio app_data si no existe
          mkdir -p app_data
          
          # Config de notificaciones SIN credenciales (la app de escritorio no las necesita)
          cat > app_data/edefrutos2025_notifications_config.json << 'EOF'
          {
            "enabled": false,
            "use_api": false,
            "recipients": [],
            "thresholds": {"cpu": 80, "memory": 90, "disk": 85, "error_rate": 5},
            "cooldown_minutes": 60,
            "last_alerts": {}
          }
          EOF
          
          # .env empaquetado: SOLO valores no secretos. Los secretos viven en
          # ~/Library/Application Support/EDF_Catalogo/.env (fuera del bundle firmado).
          cat > .env << 'EOF'
          FLASK_ENV=production
          MONGODB_DB=edf_catalogotablas
          DISABLE_MONITORING=false
          TZ=Europe/Madrid
          PYTHONPATH=.
          EOF
          
          echo "✅ Secrets y variables de entorno configurados"

      - name: Verify no secrets are embedded
        run: |
          echo "🔍 Verificando que el .env empaquetado no contiene secretos..."
          if grep -qE '^(MONGO_URI|SECRET_KEY|FLASK_SECRET_KEY|BREVO_|MAIL_PASSWORD|AWS_|GEMINI_API_KEY|GOOGLE_CLIENT_SECRET)' .env; then
            echo "🛑 El .env contiene secretos: abortando para no empaquetarlos"
            exit 1
          fi
          if grep -qiE '"(password|api_key)": *"[^"]+"' app_data/edefrutos2025_notifications_config.json 2>/dev/null; then
            echo "🛑 La config de notificaciones contiene credenciales: abortando"
            exit 1
          fi
          echo "✅ Sin secretos en el .env empaquetado"

      - name: Verify checkout
        run: |
          echo "🔍 Verificando checkout del código..."
          echo "📁 Directorio actual: $(pwd)"
          echo "📋 Archivos en el directorio raíz:"
          ls -la
          echo "📋 Archivos requirements:"
          ls -la requirements*.txt || echo "No hay archivos requirements"
          echo "✅ Verificación de checkout completada"

      - name: Verify workflow version and connectivity
        run: |
          echo "🔍 Verificando versión del workflow y conectividad..."
          echo "Workflow: Build macOS App v2.0"
          echo "Fecha: $(date)"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          
          # Verificar el commit actual
          echo "📋 Información del commit actual:"
          git log --oneline -1
          git status --porcelain
          
          # Verificar conectividad básica
          echo "🌐 Verificando conectividad..."
          if ping -c 3 pypi.org > /dev/null 2>&1; then
            echo "✅ Conectividad con PyPI OK"
          else
            echo "⚠️  Problemas de conectividad con PyPI"
          fi
          
          if ping -c 3 github.com > /dev/null 2>&1; then
            echo "✅ Conectividad con GitHub OK"
          else
            echo "⚠️  Problemas de conectividad con GitHub"
          fi
          
          echo "✅ Verificación completada"

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          check-latest: false
        timeout-minutes: 15

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Verify and create requirements file
        run: |
          echo "🔍 Verificando y creando archivo requirements_python310.txt..."
          echo "📋 Archivos en el directorio actual:"
          ls -la
          echo "📋 Archivos .txt en el directorio:"
          ls -la *.txt || echo "No hay archivos .txt"
          echo "📋 Archivos requirements:"
          ls -la requirements*.txt || echo "No hay archivos requirements"
          
          # Ejecutar script de verificación de requirements
          if [ -f "verify_requirements.sh" ]; then
            echo "🔧 Ejecutando script de verificación de requirements..."
            chmod +x verify_requirements.sh
            ./verify_requirements.sh
          else
            echo "⚠️  Script verify_requirements.sh no encontrado, usando método manual..."
            
            if [ ! -f "requirements_python310.txt" ]; then
              echo "❌ ERROR: requirements_python310.txt no encontrado"
              echo "🔧 Intentando crear el archivo desde requirements.txt..."
              
              if [ -f "requirements.txt" ]; then
                echo "📋 Copiando requirements.txt a requirements_python310.txt..."
                cp requirements.txt requirements_python310.txt
                echo "✅ Archivo creado desde requirements.txt"
              else
                echo "❌ ERROR: requirements.txt tampoco encontrado"
                echo "🔧 Creando archivo requirements_python310.txt básico..."
                echo "flask==3.0.0" > requirements_python310.txt
                echo "pymongo==4.6.0" >> requirements_python310.txt
                echo "boto3==1.34.0" >> requirements_python310.txt
                echo "pandas==2.1.0" >> requirements_python310.txt
                echo "openpyxl==3.1.2" >> requirements_python310.txt
                echo "python-dotenv==1.0.0" >> requirements_python310.txt
                echo "werkzeug==3.0.1" >> requirements_python310.txt
                echo "jinja2==3.1.2" >> requirements_python310.txt
                echo "markupsafe==2.1.3" >> requirements_python310.txt
                echo "itsdangerous==2.1.2" >> requirements_python310.txt
                echo "click==8.1.7" >> requirements_python310.txt
                echo "cryptography==41.0.7" >> requirements_python310.txt
                echo "Pillow==10.1.0" >> requirements_python310.txt
                echo "psutil==5.9.6" >> requirements_python310.txt
                echo "pywebview==5.0.7" >> requirements_python310.txt
                echo "requests==2.31.0" >> requirements_python310.txt
                echo "websockets==12.0" >> requirements_python310.txt
                echo "✅ Archivo requirements_python310.txt creado con dependencias básicas"
              fi
            else
              echo "✅ requirements_python310.txt encontrado"
            fi
          fi

      - name: Install dependencies
        run: |
          echo "📦 Instalando dependencias..."
          pip install --upgrade pip
          pip install -r requirements_python310.txt
          echo "✅ Dependencias instaladas"

      - name: Verify and create .spec file
        run: |
          echo "🔍 Verificando archivo .spec..."

          APP_VERSION=$(cat VERSION 2>/dev/null || echo "1.0.0")
          echo "📌 Versión de la app: $APP_VERSION"

          # Verificar si existe el archivo .spec correcto
          if [ -f "TablaTeca.spec" ]; then
            echo "✅ TablaTeca.spec encontrado"
            echo "📏 Tamaño del archivo: $(wc -l < TablaTeca.spec) líneas"
            echo "📋 Primeras 10 líneas:"
            head -10 TablaTeca.spec
            echo "✅ Verificación completada"
            exit 0
          fi
          
          # Si no existe, intentar ejecutar el script de verificación
          if [ -f "create_safe_spec.sh" ]; then
            echo "🔧 Ejecutando script de creación de .spec seguro..."
            chmod +x create_safe_spec.sh
            ./create_safe_spec.sh
          elif [ -f "verify_spec.sh" ]; then
            echo "🔧 Ejecutando script de verificación de spec..."
            chmod +x verify_spec.sh
            ./verify_spec.sh
          else
            echo "⚠️  Script verify_spec.sh no encontrado, creando archivo manualmente..."
            
            # Crear archivo .spec simplificado para evitar errores en GitHub Actions
            echo "# -*- mode: python ; coding: utf-8 -*-" > "TablaTeca.spec"
            echo "" >> "TablaTeca.spec"
            echo "block_cipher = None" >> "TablaTeca.spec"
            echo "" >> "TablaTeca.spec"
            echo "a = Analysis(" >> "TablaTeca.spec"
            echo "    ['launcher_native_websockets.py']," >> "TablaTeca.spec"
            echo "    pathex=[]," >> "TablaTeca.spec"
            echo "    binaries=[]," >> "TablaTeca.spec"
            echo "    datas=[" >> "TablaTeca.spec"
            echo "        ('app', 'app')," >> "TablaTeca.spec"
            echo "        ('config.py', '.')," >> "TablaTeca.spec"
            echo "        ('wsgi.py', '.')," >> "TablaTeca.spec"
            echo "        ('.env', '.')," >> "TablaTeca.spec"
            echo "        ('VERSION', '.')," >> "TablaTeca.spec"
            echo "        ('requirements.txt', '.')," >> "TablaTeca.spec"
            echo "    ]," >> "TablaTeca.spec"
            echo "    hiddenimports=[" >> "TablaTeca.spec"
            echo "        'flask', 'flask_login', 'flask_session', 'pymongo', 'requests'," >> "TablaTeca.spec"
            echo "        'webview', 'werkzeug', 'jinja2', 'markupsafe', 'itsdangerous'," >> "TablaTeca.spec"
            echo "        'click', 'blinker', 'boto3', 'botocore', 's3transfer'," >> "TablaTeca.spec"
            echo "        'jmespath', 'python_dateutil', 'urllib3', 'certifi'," >> "TablaTeca.spec"
            echo "        'charset_normalizer', 'idna', 'six', 'websockets'," >> "TablaTeca.spec"
            echo "        'asyncio', 'threading', 'tempfile', 'pathlib', 'datetime'," >> "TablaTeca.spec"
            echo "        'json', 'os', 'sys', 'time'," >> "TablaTeca.spec"
            echo "    ]," >> "TablaTeca.spec"
            echo "    hookspath=[]," >> "TablaTeca.spec"
            echo "    hooksconfig={}," >> "TablaTeca.spec"
            echo "    runtime_hooks=[]," >> "TablaTeca.spec"
            echo "    excludes=[]," >> "TablaTeca.spec"
            echo "    win_no_prefer_redirects=False," >> "TablaTeca.spec"
            echo "    win_private_assemblies=False," >> "TablaTeca.spec"
            echo "    cipher=block_cipher," >> "TablaTeca.spec"
            echo "    noarchive=False," >> "TablaTeca.spec"
            echo ")" >> "TablaTeca.spec"
            echo "" >> "TablaTeca.spec"
            echo "pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)" >> "TablaTeca.spec"
            echo "" >> "TablaTeca.spec"
            echo "exe = EXE(" >> "TablaTeca.spec"
            echo "    pyz," >> "TablaTeca.spec"
            echo "    a.scripts," >> "TablaTeca.spec"
            echo "    []," >> "TablaTeca.spec"
            echo "    exclude_binaries=True," >> "TablaTeca.spec"
            echo "    name='TablaTeca'," >> "TablaTeca.spec"
            echo "    debug=False," >> "TablaTeca.spec"
            echo "    bootloader_ignore_signals=False," >> "TablaTeca.spec"
            echo "    strip=False," >> "TablaTeca.spec"
            echo "    upx=True," >> "TablaTeca.spec"
            echo "    console=False," >> "TablaTeca.spec"
            echo "    disable_windowed_traceback=False," >> "TablaTeca.spec"
            echo "    argv_emulation=False," >> "TablaTeca.spec"
            echo "    target_arch=None," >> "TablaTeca.spec"
            echo "    codesign_identity=None," >> "TablaTeca.spec"
            echo "    entitlements_file=None," >> "TablaTeca.spec"
            echo ")" >> "TablaTeca.spec"
            echo "" >> "TablaTeca.spec"
            echo "coll = COLLECT(" >> "TablaTeca.spec"
            echo "    exe," >> "TablaTeca.spec"
            echo "    a.binaries," >> "TablaTeca.spec"
            echo "    a.zipfiles," >> "TablaTeca.spec"
            echo "    a.datas," >> "TablaTeca.spec"
            echo "    strip=False," >> "TablaTeca.spec"
            echo "    upx=True," >> "TablaTeca.spec"
            echo "    upx_exclude=[]," >> "TablaTeca.spec"
            echo "    name='TablaTeca'," >> "TablaTeca.spec"
            echo ")" >> "TablaTeca.spec"
            echo "" >> "TablaTeca.spec"
            echo "app = BUNDLE(" >> "TablaTeca.spec"
            echo "    coll," >> "TablaTeca.spec"
            echo "    name='TablaTeca.app'," >> "TablaTeca.spec"
            echo "    icon='edf_developer.icns'," >> "TablaTeca.spec"
            echo "    bundle_identifier='com.edefrutos.tablateca'," >> "TablaTeca.spec"
            echo "    info_plist={" >> "TablaTeca.spec"
            echo "        'CFBundleName': 'TablaTeca'," >> "TablaTeca.spec"
            echo "        'CFBundleDisplayName': 'TablaTeca'," >> "TablaTeca.spec"
            echo "        'CFBundleVersion': '$APP_VERSION'," >> "TablaTeca.spec"
            echo "        'CFBundleShortVersionString': '$APP_VERSION'," >> "TablaTeca.spec"
            echo "        'CFBundleExecutable': 'TablaTeca'," >> "TablaTeca.spec"
            echo "        'CFBundlePackageType': 'APPL'," >> "TablaTeca.spec"
            echo "        'CFBundleSignature': '????'," >> "TablaTeca.spec"
            echo "        'LSMinimumSystemVersion': '11.0'," >> "TablaTeca.spec"
            echo "        'NSHighResolutionCapable': True," >> "TablaTeca.spec"
            echo "        'NSRequiresAquaSystemAppearance': False," >> "TablaTeca.spec"
            echo "        'LSApplicationCategoryType': 'public.app-category.productivity'," >> "TablaTeca.spec"
            echo "        'CFBundleDevelopmentRegion': 'es'," >> "TablaTeca.spec"
            echo "        'CFBundleLocalizations': ['es', 'en']," >> "TablaTeca.spec"
            echo "        'NSHumanReadableCopyright': 'Copyright © 2026 EDF. Todos los derechos reservados.'," >> "TablaTeca.spec"
            echo "    }," >> "TablaTeca.spec"
            echo ")" >> "TablaTeca.spec"
            
            echo "✅ Archivo TablaTeca.spec creado manualmente"
            echo "📏 Tamaño del archivo: $(wc -l < TablaTeca.spec) líneas"
            echo "📋 Primeras 10 líneas:"
            head -10 TablaTeca.spec
          fi
          
          echo "✅ Verificación completada"
          
      - name: Verify requirements file
        run: |
          echo "🔍 Verificando archivo requirements..."
          ls -la requirements_python310.txt
          echo "📋 Contenido del archivo:"
          head -10 requirements_python310.txt
          echo "✅ Verificación de requirements completada"

      - name: Build App
        run: |
          echo "🔨 Iniciando construcción de la aplicación..."
          
          # Verificación final antes del build
          if [ -f "pre_build_final_check.sh" ]; then
            echo "🔍 Ejecutando verificación final pre-build..."
            chmod +x pre_build_final_check.sh
            ./pre_build_final_check.sh
          fi
          
          # Intentar usar el script de build mejorado si existe
          if [ -f "build_macos_app.sh" ]; then
            echo "🔧 Usando script de build mejorado..."
            chmod +x build_macos_app.sh
            ./build_macos_app.sh
          else
            echo "⚠️  Script build_macos_app.sh no encontrado, usando PyInstaller directamente..."
            python -m PyInstaller TablaTeca.spec --clean
          fi
          
          echo "✅ Construcción completada"

      - name: Verify build output
        run: |
          echo "Verificando salida de construcción..."
          ls -la dist/
          ls -la dist/TablaTeca.app/Contents/MacOS/ || echo "Aplicación no construida correctamente"

      - name: Import signing certificate
        if: github.event_name != 'pull_request'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "🔐 Importando certificado Developer ID Application..."
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          rm -f certificate.p12
          echo "✅ Certificado importado en keychain temporal"

      - name: Code sign app bundle
        if: github.event_name != 'pull_request'
        env:
          MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
        run: |
          echo "🔏 Firmando dist/TablaTeca.app..."
          codesign --deep --force --options runtime --timestamp \
            --entitlements entitlements.plist \
            --sign "$MACOS_CERTIFICATE_NAME" \
            "dist/TablaTeca.app"

          echo "🔍 Verificando firma..."
          codesign --verify --deep --strict --verbose=2 "dist/TablaTeca.app"
          echo "✅ Firma completada y verificada"

      - name: Create DMG
        if: github.event_name != 'pull_request'
        env:
          MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
        run: |
          echo "📦 Creando DMG..."
          mkdir -p dmg_staging
          cp -R "dist/TablaTeca.app" dmg_staging/
          ln -s /Applications dmg_staging/Applications

          hdiutil create -volname "TablaTeca" \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            "TablaTeca.dmg"

          echo "🔏 Firmando el propio DMG..."
          codesign --force --timestamp --sign "$MACOS_CERTIFICATE_NAME" "TablaTeca.dmg"
          codesign --verify --verbose=2 "TablaTeca.dmg"

          echo "✅ DMG creado y firmado: $(ls -la TablaTeca.dmg)"

      - name: Notarize DMG
        if: github.event_name != 'pull_request'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          echo "📤 Enviando DMG a notarización de Apple (puede tardar varios minutos)..."
          AUTH_KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_KEY" | base64 --decode > "$AUTH_KEY_PATH"

          xcrun notarytool submit "TablaTeca.dmg" \
            --key "$AUTH_KEY_PATH" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait

          rm -f "$AUTH_KEY_PATH"

          echo "📎 Grapando ticket de notarización al DMG..."
          xcrun stapler staple "TablaTeca.dmg"

          echo "🔍 Verificando aceptación de Gatekeeper (simulando descarga desde el navegador)..."
          xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Safari;$(uuidgen | tr 'A-Z' 'a-z')" "TablaTeca.dmg"
          spctl -a -t open --context context:primary-signature -v "TablaTeca.dmg"
          echo "✅ DMG notarizado y grapado"

      - name: Clean up keychain
        if: always() && github.event_name != 'pull_request'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true

      - name: Upload DMG artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: TablaTeca.dmg
          path: TablaTeca.dmg
          retention-days: 30

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TablaTeca.app
          path: dist/TablaTeca.app
          retention-days: 30

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            dist/
            build/
          retention-days: 7
