# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build macOS App Store (.pkg)

# Edición para la Mac App Store. Es independiente de "Build macOS App v2.0"
# (Developer ID + notarización): no comparte firma, entitlements ni artefactos.
#
# - Pull requests: compila y comprueba la estructura firmando AD HOC (sin secretos).
# - push a main / manual: firma con Apple Distribution, genera el .pkg firmado
#   con el certificado de instalador y lo valida contra App Store Connect.

on:
  push:
    branches: [ main ]
    paths:
      - 'packaging/mas/**'
      - '.github/workflows/build_macos_mas.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packaging/mas/**'
      - '.github/workflows/build_macos_mas.yml'
  workflow_dispatch:

env:
  # Debe coincidir con la versión del registro de la app en App Store Connect
  MAS_MARKETING_VERSION: '1.0'

jobs:
  build-mas:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Prepare packaged environment (sin secretos)
        run: |
          mkdir -p app_data
          cat > app_data/edefrutos2025_notifications_config.json << 'EOF'
          {
            "enabled": false,
            "use_api": false,
            "recipients": [],
            "thresholds": {"cpu": 80, "memory": 90, "disk": 85, "error_rate": 5},
            "cooldown_minutes": 60,
            "last_alerts": {}
          }
          EOF
          cat > .env << 'EOF'
          FLASK_ENV=production
          MONGODB_DB=edf_catalogotablas
          DISABLE_MONITORING=false
          TZ=Europe/Madrid
          PYTHONPATH=.
          EOF
          if grep -qE '^(MONGO_URI|SECRET_KEY|FLASK_SECRET_KEY|BREVO_|MAIL_PASSWORD|AWS_|GEMINI_API_KEY|GOOGLE_CLIENT_SECRET)' .env; then
            echo "🛑 El .env contiene secretos: abortando"
            exit 1
          fi

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          check-latest: false

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements_python310.txt

      - name: Build app (PyInstaller, onedir)
        env:
          MAS_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python -m PyInstaller packaging/mas/TablaTeca_mas.spec \
            --clean --noconfirm --distpath dist-mas --workpath build-mas
          ls -la dist-mas/
          test -x dist-mas/TablaTeca.app/Contents/MacOS/TablaTeca
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist-mas/TablaTeca.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' dist-mas/TablaTeca.app/Contents/Info.plist

      # --- Pull requests: prueba de estructura sin secretos -----------------
      - name: Ad hoc sign and package (solo comprobación)
        if: github.event_name == 'pull_request'
        env:
          MAS_AD_HOC: '1'
        run: |
          chmod +x packaging/mas/sign_and_package.sh
          packaging/mas/sign_and_package.sh dist-mas/TablaTeca.app TablaTeca-adhoc.pkg

      # --- push a main / manual: firma real --------------------------------
      - name: Import Mac App Store certificates
        if: github.event_name != 'pull_request'
        env:
          MAS_APP_CERT_P12_BASE64: ${{ secrets.MAS_APP_CERT_P12_BASE64 }}
          MAS_APP_CERT_PASSWORD: ${{ secrets.MAS_APP_CERT_PASSWORD }}
          MAS_INSTALLER_CERT_P12_BASE64: ${{ secrets.MAS_INSTALLER_CERT_P12_BASE64 }}
          MAS_INSTALLER_CERT_PASSWORD: ${{ secrets.MAS_INSTALLER_CERT_PASSWORD }}
          MAS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          trap 'echo "::error title=Importación de certificados::fallo en la línea $LINENO del paso"' ERR
          # Los logs no siempre son accesibles: los errores se publican como anotaciones
          annotate_error() { echo "::error title=$1::${2//$'\n'/%0A}"; }
          import_p12() {
            local out
            out="$(security import "$1" -k "$KEYCHAIN_PATH" -P "$2" -T /usr/bin/codesign -T /usr/bin/productbuild 2>&1)" \
              || { annotate_error "security import ($1)" "$out"; exit 1; }
            echo "$out" | sed 's/^/   /'
          }
          KEYCHAIN_PATH="$RUNNER_TEMP/mas.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$MAS_APP_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$MAS_INSTALLER_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          echo "$MAS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/tablateca.provisionprofile"

          import_p12 "$RUNNER_TEMP/app.p12" "$MAS_APP_CERT_PASSWORD"
          import_p12 "$RUNNER_TEMP/installer.p12" "$MAS_INSTALLER_CERT_PASSWORD"
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"

          # Intermedios de Apple (los certificados nuevos pueden colgar de G6)
          for ca in AppleWWDRCAG3 AppleWWDRCAG6; do
            if curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"; then
              security import "$RUNNER_TEMP/$ca.cer" -k "$KEYCHAIN_PATH" || echo "⚠️  No se pudo importar $ca"
            else
              echo "⚠️  No se pudo descargar $ca"
            fi
          done

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          APP_HASH="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" 2>/dev/null \
            | awk '/Apple Distribution|3rd Party Mac Developer Application/ { print $2; exit }' || true)"
          INSTALLER_NAME="$(security find-certificate -a -c 'Installer' "$KEYCHAIN_PATH" 2>/dev/null \
            | sed -n 's/.*"alis"<blob>="\(.*\)"$/\1/p' \
            | grep -E '3rd Party Mac Developer Installer|Mac Installer Distribution' | head -1 || true)"

          if [ -z "$APP_HASH" ] || [ -z "$INSTALLER_NAME" ]; then
            echo "🛑 No se encontraron las identidades de firma en el llavero temporal"
            annotate_error "Identidades en el llavero temporal" \
              "app='${APP_HASH:-<vacío>}' instalador='${INSTALLER_NAME:-<vacío>}'
          $(security find-identity "$KEYCHAIN_PATH" 2>&1 || true)
          --- certificados ---
          $(security find-certificate -a "$KEYCHAIN_PATH" 2>&1 | grep '"alis"' || true)"
            exit 1
          fi
          echo "🔑 Identidad de la app: $APP_HASH"
          echo "🔑 Identidad del instalador: $INSTALLER_NAME"

          {
            echo "MAS_KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "MAS_APP_HASH=$APP_HASH"
            echo "MAS_INSTALLER_NAME=$INSTALLER_NAME"
          } >> "$GITHUB_ENV"

      - name: Sign and package for the Mac App Store
        if: github.event_name != 'pull_request'
        env:
          APP_SIGN_IDENTITY: ${{ env.MAS_APP_HASH }}
          INSTALLER_SIGN_IDENTITY: ${{ env.MAS_INSTALLER_NAME }}
          PROVISIONING_PROFILE: ${{ runner.temp }}/tablateca.provisionprofile
          KEYCHAIN_PATH: ${{ env.MAS_KEYCHAIN_PATH }}
        run: |
          chmod +x packaging/mas/sign_and_package.sh
          packaging/mas/sign_and_package.sh dist-mas/TablaTeca.app TablaTeca-MAS.pkg

      - name: Validate package with App Store Connect
        if: github.event_name != 'pull_request'
        # La validación es informativa: no bloquea la subida del artefacto
        continue-on-error: true
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.private_keys"
          P8="$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          trap 'rm -f "$P8"' EXIT
          echo "$APP_STORE_CONNECT_KEY" | base64 --decode > "$P8"
          # La salida de altool se publica como anotación: los logs no siempre son accesibles
          if out="$(xcrun altool --validate-app -f TablaTeca-MAS.pkg -t macos \
              --apiKey "$APP_STORE_CONNECT_KEY_ID" \
              --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" 2>&1)"; then
            echo "$out"
            echo "::notice title=Validación de App Store Connect::${out//$'\n'/%0A}"
          else
            echo "$out"
            resumen="$(echo "$out" | grep -oE '\([0-9]{5}\)' | sort | uniq -c | tr '\n' ' ')"
            otros="$(echo "$out" | grep -E 'ERROR: \[altool' | grep -v '(90284)' | head -8 || true)"
            echo "::error title=Validación de App Store Connect falló::Códigos: ${resumen}%0A${otros//$'\n'/%0A}"
            exit 1
          fi

      - name: Clean up keychain and profile
        if: always() && github.event_name != 'pull_request'
        run: |
          security delete-keychain "$RUNNER_TEMP/mas.keychain-db" || true
          rm -f "$RUNNER_TEMP/tablateca.provisionprofile" "$RUNNER_TEMP"/*.p12 "$RUNNER_TEMP"/*.cer

      - name: Upload .pkg artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: TablaTeca-MAS.pkg
          path: TablaTeca-MAS.pkg
          retention-days: 30
